name: Test Secrets Safe Integration 5

on:
  workflow_dispatch:

jobs:
  get-github-secret:
    runs-on: [self-hosted, linux, ps-secrets]
    environment: BT_PAS
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix runner temp permissions
        run: |
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          chmod -R 777 "$RUNNER_TEMP" 2>/dev/null || true
          # 상위 _work/_temp도 함께 열어줌 (다음 스텝에서 하위 폴더가 새로 생성되므로)
          chmod -R 777 "$(dirname "$RUNNER_TEMP")" 2>/dev/null || true

      - name: Get secret from Secrets Safe
        id: get_secret
        uses: BeyondTrust/secrets-safe-action/get_secret@26b034aa43d67f95661ebabe84299c9416a65852
        env:
          API_URL: ${{ vars.API_URL }}
          VERIFY_CA: ${{ vars.VERIFY_CA }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          API_VERSION: ${{ vars.API_VERSION }}
        with:
          SECRET_PATH: '{"path": "wk_text/wk_github/wk_github_pat", "output_id": "github_pat"}'
          DECRYPT: true

      - name: Use retrieved secret
        run: |
          echo "Secret 회수 성공 (마스킹됨): ${{ steps.get_secret.outputs.github_pat }}"