name: Test Secrets Safe (aws secret) Integration

on:
  workflow_dispatch:

jobs:
  get-github-secret:
    runs-on: [self-hosted, linux, ps-secrets]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get secret from Secrets Safe
        id: get_secret
        uses: BeyondTrust/secrets-safe-action/get_secret@26b034aa43d67f95661ebabe84299c9416a65852
        env:
          API_URL: ${{ vars.API_URL }}
          VERIFY_CA: ${{ vars.VERIFY_CA }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          API_VERSION: ${{ vars.API_VERSION }}
        with:
          SECRET_PATH: '{"path": "wk_Secrets_Safe_Text/wk_aws/wk_aws_SecretAccessKey", "output_id": "aws_secret"}'
          DECRYPT: true

      - name: Use retrieved secret
        run: |
          echo "Secret 회수 성공 (마스킹됨): ${{ steps.get_secret.outputs.aws_secret }}"
          
      - name: Write to local file for debugging (self-hosted only)
        run: |
          echo "${{ steps.get_secret.outputs.aws_secret }}" > /tmp/debug_secret_check.txt
          chmod 600 /tmp/debug_secret_check.txt