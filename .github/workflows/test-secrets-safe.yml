name: Test Secrets Safe Integration

on:
  workflow_dispatch:      # Actions 탭에서 수동 실행 버튼이 뜨게 함

jobs:
  get-github-secret:
    runs-on: [self-hosted, linux, ps-secrets]   # 7번에서 등록한 러너 라벨과 정확히 일치해야 함
    steps:
      - name: Checkout (선택)
        uses: actions/checkout@v4

      - name: Get secret from Secrets Safe
        id: get_secret                          # 이후 outputs 참조를 위해 id 필수
        uses: BeyondTrust/secrets-safe-action/get_secret@26b034aa43d67f95661ebabe84299c9416a65852
        env:
          API_URL: ${{ vars.API_URL }}
          VERIFY_CA: ${{ vars.VERIFY_CA }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          API_VERSION: ${{ vars.API_VERSION }}
        with:
          SECRET_PATH: '{"path": "wk_text/wk_github_PAT", "output_id": "github_pat"}'
          DECRYPT: true

      - name: Use retrieved secret
        run: |
          echo "Secret 회수 성공 (마스킹됨): ${{ steps.get_secret.outputs.github_pat }}"